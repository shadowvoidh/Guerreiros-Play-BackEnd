[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so client-side routes (and the custom 404 inside the app)
# work on refresh / direct link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"

# When a real backend/API is added, its auth cookie MUST be set by the
# server (not document.cookie) with: Set-Cookie: session=...; HttpOnly;
# Secure; SameSite=Lax; Path=/  -- HttpOnly/Secure cannot be set from a
# static file host and require actual server response headers.
