<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Content-Security-Policy delivered via <meta> as a defense-in-depth layer.
      The AUTHORITATIVE copy of this policy must also be sent as a real HTTP
      response header by the server/CDN (see netlify.toml / SECURITY.md) —
      a meta tag cannot set frame-ancestors, cannot block some header-only
      attacks, and is not a substitute for the HTTP header.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Guerreiros Play — Catálogo de jogos de luta e ação</title>
    <meta
      name="description"
      content="Guerreiros Play é o catálogo escolar de jogos de luta e ação: conheça Ultimate Fight, Eclipse das Almas e outros títulos, com fotos, descrição e preço."
    />
    <link rel="canonical" href="https://guerreirosplay.example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Guerreiros Play" />
    <meta property="og:title" content="Guerreiros Play — Catálogo de jogos de luta e ação" />
    <meta
      property="og:description"
      content="Catálogo escolar de jogos de luta e ação com fotos, descrição e preço de cada título."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b0b0a" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-void-950 text-bone-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
